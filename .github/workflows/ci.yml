name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Xcode 16 / iOS 18 SDK
            runner: macos-15
            xcode: /Applications/Xcode_16.4.app
            simulator: iPhone 16 Pro
          - name: Xcode 27 / iOS 27 SDK
            runner: xcode-27
            xcode: /Applications/Xcode.app
            simulator: iPhone 17 Pro
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s '${{ matrix.xcode }}'
      - name: Print toolchain
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: >-
          xcodebuild build
          -scheme UIKitSwiftUI
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Build for Mac Catalyst
        run: >-
          xcodebuild build
          -scheme UIKitSwiftUI
          -destination 'generic/platform=macOS,variant=Mac Catalyst'
          CODE_SIGNING_ALLOWED=NO
      - name: Test on iOS Simulator
        run: >-
          xcodebuild test
          -scheme UIKitSwiftUI
          -destination 'platform=iOS Simulator,name=${{ matrix.simulator }},OS=latest'
          CODE_SIGNING_ALLOWED=NO

  test-ios16:
    name: Xcode 16 / iOS 16 simulator
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Print toolchain
        run: xcodebuild -version
      - name: Install iOS 16.4 simulator runtime
        run: |
          command -v xcodes >/dev/null || brew install xcodesorg/made/xcodes
          sudo xcodes runtimes install 'iOS 16.4'
      - name: Create iOS 16 simulator
        run: xcrun simctl create 'iPhone-14-iOS-16-4' 'iPhone 14' 'iOS16.4'
      - name: Test on iOS 16 Simulator
        run: >-
          xcodebuild test
          -scheme UIKitSwiftUI
          -destination 'platform=iOS Simulator,name=iPhone-14-iOS-16-4,OS=16.4'
          CODE_SIGNING_ALLOWED=NO

  test-macos:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Xcode 16 / native macOS
            runner: macos-15
            xcode: /Applications/Xcode_16.4.app
          - name: Xcode 27 / native macOS
            runner: xcode-27
            xcode: /Applications/Xcode.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s '${{ matrix.xcode }}'
      - name: Print toolchain
        run: xcodebuild -version
      - name: Build AppKit with macOS 13 deployment target
        run: swift build --product AppKitSwiftUI
      - name: Test native AppKit bridges
        run: swift test
